name: TitipJalur CI/CD Pipeline (P11)

on:
  push:
    branches:
      - v1.0_dev
      - V1.1
      - main
  pull_request:
    branches:
      - v1.0_dev
      - V1.1
      - main

permissions:
  contents: write

jobs:
  unit-test:
    name: Unit Test Gate (200+ UT)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze lib

      - name: Run 200+ Unit & Widget Tests
        run: flutter test --reporter=expanded

  build-and-deploy:
    name: Auto Build & Deploy (Live)
    needs: unit-test
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-pub

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: titipjalur-${{ github.ref_name }}-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Deploy Release to GitHub Releases (V1.1 Live)
        if: github.ref == 'refs/heads/V1.1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "V1.1-${{ github.run_number }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "TitipJalur V1.1 (Build #${{ github.run_number }})" \
            --notes "Automated build & deploy after all 200+ unit tests passed (Hijau)."
